appId: com.micshare.desktop
productName: Mic Share
copyright: Copyright (c) 2026 Mic Share

publish:
  provider: github
  owner: krushna06
  repo: MicShare

directories:
  output: release

electronDist: ../node_modules/electron/dist

files:
  - dist/**/*
  - src/main/**/*
  - src/preload/**/*
  - package.json

asar: true
compression: normal

asarUnpack:
  - node_modules/node-global-key-listener/bin/**

npmRebuild: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mic Share
  deleteAppDataOnUninstall: false
